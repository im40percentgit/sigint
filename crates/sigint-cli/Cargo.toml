sigint-core = { workspace = true }
sigint-llm = { workspace = true }
sigint-plugin = { workspace = true }
sigint-store = { workspace = true }
sigint-agents = { workspace = true }
sigint-tools = { workspace = true }
sigint-tui = { workspace = true }
sigint-memory = { workspace = true }
sigint-recon = { workspace = true }
sigint-report = { workspace = true }
sigint-train = { workspace = true }
sigint-web = { workspace = true }
anyhow = { workspace = true }
tokio = { workspace = true }
clap = { workspace = true }
uuid = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
