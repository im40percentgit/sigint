[package]
name = "sigint-agents"
version.workspace = true
edition.workspace = true

[dependencies]
sigint-core = { workspace = true }
sigint-llm = { workspace = true }
sigint-tools = { workspace = true }
sigint-memory = { workspace = true }
sigint-store = { workspace = true }
tokio = { workspace = true }
chrono = { workspace = true }
async-trait = { workspace = true }
futures-util = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
# async-stream is used in loop_engine tests to build mock stalling streams.
async-stream = "0.3"
# tokio test-util enables pause/advance for time-based tests without real sleeps.
tokio = { version = "1", features = ["test-util"] }
