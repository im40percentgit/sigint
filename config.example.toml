# SIGINT Configuration
# Copy to: ~/.config/sigint/config.toml

[llm]
# LLM provider: "ollama" (default), "openai", "llama-cpp"
provider = "ollama"
# Model name
model = "llama3.2"
# Provider API endpoint
base_url = "http://localhost:11434"
# For Docker: use service name instead of localhost
# base_url = "http://ollama:11434"
# Sampling temperature (0.0-1.0)
temperature = 0.7
# Context window in tokens (0 = provider default)
context_window = 8192
# API key for cloud providers (or set SIGINT_API_KEY env var)
# api_key = "sk-..."

# For llama.cpp (local, no API key needed):
# provider = "llama-cpp"
# model = "your-model-name"
# base_url = "http://localhost:8080"

# For embedded llama.cpp (no external server, requires --features embedded-llm):
# provider = "embedded"
# model = "llama-3.2-8B-Q4_K_M.gguf"
# models_dir = "~/.local/share/sigint/models"
# gpu_layers = 99          # -1 or 99 = all layers on GPU, 0 = CPU only
# threads = 16             # CPU threads for inference (0 = auto-detect)
# flash_attention = true   # Enable flash attention for faster inference

[store]
# SQLite database path (~ expanded)
db_path = "~/.local/share/sigint/sigint.db"

[log]
# Tracing filter string
level = "sigint=info,warn"

[agent]
# Auto-approve tool calls by risk level: "none", "low", "medium", "all"
auto_approve = "low"
# Seconds to wait for operator approval before timeout
approval_timeout = 300
# Enable episodic memory recall from prior scans (or use --memory flag)
memory = false
# Run ReconEngine before scanning (or use --recon flag)
recon = false

[tools]
# Default output cap in bytes for all tools
default_output_cap = 1048576  # 1 MB

# Per-tool overrides (optional)
# [tools.overrides.nmap]
# output_cap = 2097152  # 2 MB
# timeout = 300

# [tools.overrides.nuclei]
# output_cap = 2097152
# timeout = 600

# ── Fine-tuning pipeline (optional) ──────────────────────────────────────────
#
# The [train] section is entirely optional. Leave it out (or keep every line
# commented) and `sigint train harvest / export` still work; only
# `sigint train finetune` will refuse to run until finetune_command is set.
#
# Environment variables passed to the trainer binary:
#   SIGINT_TRAIN_JSONL  — path to the training split (JSONL, OpenAI format)
#   SIGINT_TEST_JSONL   — path to the held-out test split
#   SIGINT_BASE_MODEL   — base model tag supplied via --base flag
#   SIGINT_OUTPUT_PATH  — requested output path for the fine-tuned adapter
#
# Example finetune_command values (pick one):
#
#   unsloth (recommended for consumer GPUs):
#     finetune_command = "unsloth-cli --train $SIGINT_TRAIN_JSONL --output $SIGINT_OUTPUT_PATH --base $SIGINT_BASE_MODEL"
#
#   axolotl (flexible, YAML-config-driven):
#     finetune_command = "axolotl train --data $SIGINT_TRAIN_JSONL --base-model $SIGINT_BASE_MODEL --output-dir $SIGINT_OUTPUT_PATH"
#
#   MLX (Apple Silicon):
#     finetune_command = "mlx_lm.lora --train --data $SIGINT_TRAIN_JSONL --model $SIGINT_BASE_MODEL --adapter-path $SIGINT_OUTPUT_PATH"

[train]
# External command used for fine-tuning. Must read env vars listed above.
# Leaving this empty (the default) disables `sigint train finetune`.
# finetune_command = "unsloth-cli --train $SIGINT_TRAIN_JSONL --output $SIGINT_OUTPUT_PATH --base $SIGINT_BASE_MODEL"

# Minimum number of test-set examples required before `sigint model promote`
# will accept a candidate model. Default: 50.
# min_eval_examples = 50

# Directory where fine-tune job records (jobs.json) and adapter outputs live.
# Default: ~/.local/share/sigint/training/
# job_dir = "~/.local/share/sigint/training"
