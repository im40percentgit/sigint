[workspace]
members = [
    "crates/sigint-core",
    "crates/sigint-llm",
    "crates/sigint-agents",
    "crates/sigint-sandbox",
    "crates/sigint-store",
    "crates/sigint-tools",
    "crates/sigint-recon",
    "crates/sigint-tui",
    "crates/sigint-web",
    "crates/sigint-cli",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["SIGINT Contributors"]
license = "MIT"

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"

# HTTP
reqwest = { version = "0.12", features = ["stream", "json"] }
eventsource-stream = "0.2"

# CLI
clap = { version = "4", features = ["derive"] }

# Database
rusqlite = { version = "0.31", features = ["bundled"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# Error handling
thiserror = "2"
anyhow = "1"

# Logging / tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Streams / futures
futures-util = "0.3"

# Types
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }

# Workspace crates
sigint-core = { path = "crates/sigint-core" }
sigint-llm = { path = "crates/sigint-llm" }
sigint-store = { path = "crates/sigint-store" }
sigint-agents = { path = "crates/sigint-agents" }
sigint-sandbox = { path = "crates/sigint-sandbox" }
sigint-tools = { path = "crates/sigint-tools" }
sigint-recon = { path = "crates/sigint-recon" }
sigint-tui = { path = "crates/sigint-tui" }
sigint-web = { path = "crates/sigint-web" }
