[workspace]
members = [
    "crates/sigint-core",
    "crates/sigint-llm",
    "crates/sigint-agents",
    "crates/sigint-sandbox",
    "crates/sigint-store",
    "crates/sigint-tools",
    "crates/sigint-plugin",
    "crates/sigint-recon",
    "crates/sigint-tui",
    "crates/sigint-web",
    "crates/sigint-cli",
    "crates/sigint-memory",
    "crates/sigint-report",
    "crates/sigint-train",
    "tests/e2e",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["SIGINT Contributors"]
license = "MIT"

[workspace.dependencies]
# Plugin registration
inventory = "0.3"

# Async runtime
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"

# HTTP
reqwest = { version = "0.12", features = ["stream", "json"] }
eventsource-stream = "0.2"

# Web server
axum = { version = "0.8", features = ["ws"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors"] }

# CLI
clap = { version = "4", features = ["derive"] }

# Database
rusqlite = { version = "0.31", features = ["bundled", "functions"] }
r2d2 = "0.8"
r2d2_sqlite = "0.24"
fastembed = "4"
bytemuck = { version = "1", features = ["derive"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# Error handling
thiserror = "2"
anyhow = "1"

# Logging / tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Async trait support
async-trait = "0.1"

# Streams / futures
futures-util = "0.3"

# Types
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }

# Workspace crates
sigint-core = { path = "crates/sigint-core" }
sigint-llm = { path = "crates/sigint-llm" }
sigint-store = { path = "crates/sigint-store" }
sigint-agents = { path = "crates/sigint-agents" }
sigint-sandbox = { path = "crates/sigint-sandbox" }
sigint-tools = { path = "crates/sigint-tools" }
sigint-plugin = { path = "crates/sigint-plugin" }
sigint-recon = { path = "crates/sigint-recon" }
sigint-tui = { path = "crates/sigint-tui" }
sigint-web = { path = "crates/sigint-web" }
sigint-memory = { path = "crates/sigint-memory" }
sigint-report = { path = "crates/sigint-report" }
sigint-train = { path = "crates/sigint-train" }
pulldown-cmark = "0.12"
quick-xml = "0.37"
regex = { version = "1", default-features = false, features = ["std"] }
rust-embed = "8"
mime_guess = "2"

# TUI
ratatui = "0.29"
crossterm = "0.28"

# Security
subtle = "2"
rand = { version = "0.8", features = ["std"] }
ipnet = "2"
